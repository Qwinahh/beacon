name: Alpha — Urgent Signal Fast-Track

on:
  schedule:
    # Every 30 minutes. Only actually posts if an urgency-3 signal is found
    # AND the 1-hour cooldown since the last post has elapsed.
    # Cheap to run: exits in <5s if nothing urgent is live.
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  alpha:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run alpha fast-track
        env:
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:         ${{ secrets.GITHUB_TOKEN }}
          X_SCRAPER_COOKIES:    ${{ secrets.X_SCRAPER_COOKIES }}
          WHALE_ALERT_API_KEY:  ${{ secrets.WHALE_ALERT_API_KEY }}
          DROPSTAB_API_KEY:     ${{ secrets.DROPSTAB_API_KEY }}
        run: python post.py --alpha-only

      - name: Commit state and memory
        run: |
          git config user.name  "qwinahh-bot"
          git config user.email "bot@qwinahh.local"
          git add data/state.json data/memory/ data/projects/ data/vault/
          git diff --cached --quiet || git commit -m "chore: alpha state + vault [skip ci]"
          # Pull-rebase before push — alpha.yml and post.yml can run simultaneously
          # and both push state.json; without this one will fail with non-fast-forward
          # and the other's write may corrupt the file mid-push.
          git pull --rebase origin main 2>/dev/null || true
          git push
