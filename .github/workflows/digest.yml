name: Daily Digest

on:
  schedule:
    # Runs at 22:30 UTC every day — after the last posting window closes.
    - cron: "30 22 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
        run: python digest_run.py

      - name: Commit digest file
        run: |
          git config user.name  "qwinahh-bot"
          git config user.email "bot@qwinahh.local"
          git add data/digests/
          git diff --cached --quiet || git commit -m "chore: daily digest [skip ci]"
          git push
