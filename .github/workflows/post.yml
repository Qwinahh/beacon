name: Post — Crypto Commentary

on:
  schedule:
    # Two windows per day, inside the peak engagement hours in config.py.
    # The bot posts max 3x/day — these triggers just wake it up to check.
    # Jitter in post.py prevents every post landing at exactly :00.
    - cron: "0 13 * * *"   # US morning / EU afternoon (peak window)
    - cron: "0 16 * * *"   # Mid-window check (catches anything missed at 13:00)
    - cron: "0 19 * * *"   # US prime time
  workflow_dispatch:        # Allow manual trigger from the Actions tab.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to commit state.json back to the repo.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
          # LLM providers — Groq is free (14,400/day). Set at least one.
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          X_SCRAPER_COOKIES:    ${{ secrets.X_SCRAPER_COOKIES }}
          WHALE_ALERT_API_KEY:  ${{ secrets.WHALE_ALERT_API_KEY }}
          DROPSTAB_API_KEY:     ${{ secrets.DROPSTAB_API_KEY }}
        run: python post.py

      - name: Commit state and memory
        run: |
          git config user.name  "qwinahh-bot"
          git config user.email "bot@qwinahh.local"
          git add data/state.json data/memory/ data/projects/ data/vault/
          git diff --cached --quiet || git commit -m "chore: update bot state + vault [skip ci]"
          # Ensure we're on main (concurrent runs can leave a detached HEAD)
          git checkout master 2>/dev/null || true
          # Merge instead of rebase — avoids add/add conflicts and detached HEAD issues.
          # -X ours keeps the Actions-side version on any content conflict.
          git pull --no-rebase -X ours origin master 2>/dev/null || true
          git push origin master
