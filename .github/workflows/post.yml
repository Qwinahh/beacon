name: Post — Crypto Commentary

on:
  schedule:
    # Six trigger points per day — bot posts up to 6x/day if content quality passes.
    # Jitter in post.py prevents all posts landing at exactly :00.
    # Spread across EU morning → US late night to hit every audience window.
    - cron: "0 8  * * *"   # EU morning open
    - cron: "0 11 * * *"   # EU midday / Asian close
    - cron: "0 14 * * *"   # US morning / EU afternoon (peak)
    - cron: "0 17 * * *"   # US midday
    - cron: "0 20 * * *"   # US prime time (biggest window)
    - cron: "0 22 * * *"   # US late / works while you sleep
  workflow_dispatch:        # Allow manual trigger from the Actions tab.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Required to commit state.json back to the repo.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          X_API_KEY:            ${{ secrets.X_API_KEY }}
          X_API_SECRET:         ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:       ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:      ${{ secrets.X_ACCESS_SECRET }}
          # LLM providers — Groq is free (14,400/day). Set at least one.
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY:     ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          X_SCRAPER_COOKIES:    ${{ secrets.X_SCRAPER_COOKIES }}
          WHALE_ALERT_API_KEY:  ${{ secrets.WHALE_ALERT_API_KEY }}
          DROPSTAB_API_KEY:     ${{ secrets.DROPSTAB_API_KEY }}
          # Optional — enables image generation (agents/image_agent.py).
          # Posting continues text-only when unset.
          REPLICATE_API_TOKEN:  ${{ secrets.REPLICATE_API_TOKEN }}
        run: python post.py

      - name: Commit state and memory
        run: |
          git config user.name  "qwinahh-bot"
          git config user.email "bot@qwinahh.local"
          git add data/state.json data/memory/ data/projects/ data/vault/
          git diff --cached --quiet || git commit -m "chore: update bot state + vault [skip ci]"
          # Ensure we're on main (concurrent runs can leave a detached HEAD)
          git checkout main 2>/dev/null || true
          # Merge instead of rebase — avoids add/add conflicts and detached HEAD issues.
          # -X ours keeps the Actions-side version on any content conflict.
          git pull --no-rebase -X ours origin main 2>/dev/null || true
          git push origin main
