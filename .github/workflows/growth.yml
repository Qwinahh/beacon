name: Growth — Weekly Performance Analysis

on:
  schedule:
    # Every Sunday at 09:00 UTC — after a full week of posts and metric collection
    - cron: "0 9 * * 0"
  workflow_dispatch:   # Manual trigger any time

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  growth:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run growth analysis
        env:
          X_API_KEY:         ${{ secrets.X_API_KEY }}
          X_API_SECRET:      ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          X_BEARER_TOKEN:    ${{ secrets.X_BEARER_TOKEN }}
          GROQ_API_KEY:      ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agents.growth_agent

      - name: Commit growth context + vault report
        run: |
          git config user.name  "qwinahh-bot"
          git config user.email "bot@qwinahh.local"
          git add data/growth/ data/vault/growth/
          git diff --cached --quiet || git commit -m "growth: weekly analysis + performance context [skip ci]"
          git push
